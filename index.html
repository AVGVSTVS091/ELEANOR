<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/assets/aguai/logo.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0c4a6e" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGUAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    
    @keyframes logo-glow-in {
      0% {
        opacity: 0;
        transform: scale(0.9);
        filter: drop-shadow(0 0 0px #4acbff);
      }
      70% {
        opacity: 1;
        transform: scale(1.02);
        filter: drop-shadow(0 0 15px #4acbff);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        filter: drop-shadow(0 0 8px #4acbff);
      }
    }

    .animate-logo-in {
      animation: logo-glow-in 0.9s ease-out forwards;
    }

    .animate-app-fade-in {
        animation: app-fade-in 0.5s ease-in-out forwards;
    }

    @keyframes app-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    
    @keyframes send-flash {
      0% { background-color: #0ea5e9; } /* sky-500 */
      50% { background-color: #facc15; } /* yellow-400 */
      100% { background-color: #0ea5e9; }
    }
    .animate-send-flash {
      animation: send-flash 0.3s ease-out;
    }

    .task-completing {
        background-color: #dcfce7 !important; /* Tailwind green-100 */
        opacity: 0;
        transform: scale(0.95);
    }
    html.dark .task-completing {
        background-color: #166534 !important; /* Tailwind green-800 */
    }

    .custom-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
    
    .custom-scrollbar::-webkit-scrollbar {
      display: none; /* Hide scrollbar for Chrome, Safari and Opera */
    }

    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #111827; /* gray-900 */
      opacity: 1;
      transition: opacity 300ms ease-out;
    }
    #splash-screen.splash-fade-out {
      opacity: 0;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>
<script>
  // On page load or when changing themes, best to add inline in `head` to avoid FOUC
  if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark')
  } else {
    document.documentElement.classList.remove('dark')
  }
</script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0?dev",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?dev",
    "react/": "https://aistudiocdn.com/react@^18.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
    "xlsx": "https://aistudiocdn.com/xlsx@^0.18.5",
    "jsqr": "https://aistudiocdn.com/jsqr@^1.4.0",
    "jspdf": "https://aistudiocdn.com/jspdf@^2.5.1",
    "jspdf-autotable": "https://aistudiocdn.com/jspdf-autotable@^3.8.2",
    "react-dom/": "https://aistudiocdn.com/react-dom@^18.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-white text-gray-800 dark:bg-gray-900 dark:text-gray-200">
  <div id="splash-screen">
    <span class="sr-only">Loading application...</span>
    <img
      src="/assets/aguai/logo.png"
      alt="AGUAI Logo"
      class="w-48 h-48 md:w-64 md:h-64 animate-logo-in"
      aria-hidden="true"
      onerror="this.style.display='none'; console.warn('Splash screen image failed to load.');"
    />
  </div>
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').then(registration => {
          console.log('ServiceWorker registration successful with scope: ', registration.scope);
        }, err => {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
